apiVersion: apps/v1
kind: Deployment
metadata:
  name: excel-insightforge-agent
  labels:
    app: excel-insightforge-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: excel-insightforge-agent
  template:
    metadata:
      labels:
        app: excel-insightforge-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: appars/excel-insightforge-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-secret
                  key: GROQ_API_KEY
                  optional: true        # Analytics Mode if secret absent
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi             # demo dataset (50k rows) needs headroom
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
