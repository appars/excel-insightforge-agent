apiVersion: v1
kind: Service
metadata:
  name: excel-insightforge-agent
  labels:
    app: excel-insightforge-agent
spec:
  type: NodePort            # easy access on Rancher Desktop; use LoadBalancer in cloud
  selector:
    app: excel-insightforge-agent
  ports:
    - name: http
      port: 80
      targetPort: 8501
      nodePort: 30851
