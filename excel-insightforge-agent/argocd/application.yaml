apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: excel-insightforge-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/appars/excel-insightforge-agent
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true           # delete resources removed from Git
      selfHeal: true        # revert manual drift — the GitOps "wow" moment
    syncOptions:
      - CreateNamespace=true
